schema_version: 1
schema_id: benchmark.case_linked_shortcut_audit_plan.v1
benchmark_version: v1
created_at_utc: 2026-08-22T17:30:00Z
maximum_surface_accuracy: 0.25
anchors:
  - source_case_id: h-c1m1-01
    expected_stdout: "24\n"
  - source_case_id: h-c1m2-01
    expected_stdout: "14 20\n"
  - source_case_id: h-c2m1-01
    expected_stdout: "dark\n"
  - source_case_id: h-c2m2-01
    expected_stdout: "['new', 'urgent']\n"
  - source_case_id: h-c3m1-01
    expected_stdout: "Anas\n"
  - source_case_id: h-c3m2-01
    expected_stdout: "old new\n"
  - source_case_id: h-c4m1-01
    expected_stdout: "cool\n"
