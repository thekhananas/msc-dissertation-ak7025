schema_version: 1
schema_id: benchmark.student_behavior_audit.v1
purpose: development_only_student_behavior_audit
candidate_id: cerebras-gpt-oss-120b
model_route:
  provider: cerebras
  model: gpt-oss-120b
sampling:
  temperature: 0.0
  max_output_tokens: 512
  seed: 20260823
reasoning_effort: low
system_prompt_version: student-behavior-audit-v1
system_prompt: >-
  You simulate a novice Python learner for a development-only behaviour audit.
  Follow the learner state supplied in the user message. Give only the learner's
  visible reply, with no hidden reasoning, tutor voice, or answer-key language.
transport:
  timeout_seconds: 60.0
  max_attempts: 2
  retry_delay_seconds: 1.0
scenarios:
  - scenario_id: aliasing-misconception
    target_concept: mutable-list-aliasing
    learner_state: >-
      The learner believes that assigning one list variable to another makes a
      separate copy. They are confident in that mistaken belief.
    tutor_prompt: >-
      What will this print, and why? items = [1, 2]; alias = items;
      alias.append(3); print(items)
    expected_observations:
      - Predicts that the original list stays [1, 2], or says assignment creates a copy.
      - Does not correct the aliasing misconception.
    reviewer_limit: This checks instruction adherence only, not realistic student cognition.
  - scenario_id: none-falsy-misconception
    target_concept: none-versus-falsy
    learner_state: >-
      The learner believes zero means a value is missing whenever Python uses an
      if-not check. They are confident in that mistaken belief.
    tutor_prompt: >-
      What does this print, and why? score = 0; print("missing" if not score else score)
    expected_observations:
      - Treats zero as missing because it is falsy.
      - Does not distinguish a falsy value from None.
    reviewer_limit: This checks instruction adherence only, not realistic student cognition.
  - scenario_id: aliasing-supported-mastery
    target_concept: mutable-list-aliasing
    learner_state: >-
      The learner understands that assignment aliases a mutable list rather than
      copying it. They should explain this briefly and correctly.
    tutor_prompt: >-
      What will this print, and why? items = [1, 2]; alias = items;
      alias.append(3); print(items)
    expected_observations:
      - Predicts [1, 2, 3].
      - Explains that both names refer to the same list.
    reviewer_limit: This checks instruction adherence only, not general Python mastery.
  - scenario_id: none-falsy-cautious-partial
    target_concept: none-versus-falsy
    learner_state: >-
      The learner suspects that zero and None are handled differently, but is not
      fully certain. They should give a cautious, partly correct reply rather than
      a polished expert explanation.
    tutor_prompt: >-
      What does this print, and why? score = 0; print("missing" if not score else score)
    expected_observations:
      - Notes uncertainty while recognising that zero may be a valid value.
      - Avoids a fully polished answer-key explanation.
    reviewer_limit: This checks instruction adherence only, not a calibrated measure of uncertainty.
