schema_id: publication.figure_register.v1
schema_version: 1
register_id: dissertation-results-v1
register_status: amended_for_completed_m7c
frozen_on: 2026-09-07
last_amended_on: 2026-09-10
amendment: >-
  M7C added one real-data uncertainty figure and one model table after its
  bounded companion study closed. The original registered items did not change.
purpose: >-
  Freeze the small set of visuals and tables used to explain the implemented
  system, corrected external-model benchmark, Bayesian tracker study, and
  reliability-aware acquisition study, plus the separate CSEDM companion result.
selection_rule: >-
  Each main-text item must answer a distinct question. Supporting diagnostics
  belong in an appendix or presentation backup; they must not repeat a primary
  result without adding a clear explanation.
format_rule: >-
  PDF and SVG are vector export formats. Report and presentation profiles may
  change dimensions and type scale, but colour semantics and reported values
  must remain identical.
visible_timestamp_rule: >-
  Generation dates belong in machine-readable manifests, not in visible figure
  text.

figures:
  - figure_id: FIG-01
    title: System boundaries and evidence paths
    question: Which parts of the project run in the demo, external benchmark, and tracker study?
    source: configs/publication/v1-system-boundary.yaml
    output_manifest: artifacts/publication/system-boundary-v14-5a121e6/system_boundary_figure_manifest.json
    output_manifest_hash: 45fc42fd08c953bb989aa1f90af8050b7c2d4d88fc6d46a1f7756160d2bc3bc6
    generation_revision: 5a121e6
    command: pixi run python scripts/benchmark_cli.py system-boundary-figure
    outputs: system_boundaries.pdf, system_boundaries.svg, system_boundary_components.csv
    destination: report-methods-and-presentation-overview
    status: primary
    availability: complete
    intended_claim: >-
      The demo, external-model benchmark, and simulator studies are separate
      evidence paths with different claim limits.
    claim_boundary: >-
      Describes implemented paths and ownership; does not establish tutoring
      effectiveness or human learning.
    caption: >-
      The project uses separate paths for the local tutoring demo, the sealed
      external-model benchmark, and offline simulator studies. They exchange
      saved records rather than hidden live state. The diagram describes system
      boundaries; it does not provide evidence of tutoring effectiveness or
      human learning.

  - figure_id: FIG-02
    title: Benchmark design and commit-reveal sequence
    question: How were predictions kept separate from the later coding outcome?
    source: configs/benchmark/v1-analysis-spec.yaml
    output_manifest: >-
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/study-design-v1/publication-v4-5a121e6/study_design_figure_manifest.json
    output_manifest_hash: 7d6a44df43eb2ffd301ba15d49678dace3a43728d3ff7ebcdda5a1f19b7c719e
    generation_revision: 5a121e6
    command: pixi run python scripts/benchmark_cli.py study-design-figure
    outputs: external_study_design.pdf, external_study_design.svg, study_design_stages.csv
    destination: report-methods-and-presentation-method
    status: primary
    availability: complete
    intended_claim: >-
      Condition predictions were committed before the separate criterion task
      was revealed and scored.
    claim_boundary: >-
      Explains the measurement procedure; it is not evidence that the procedure
      improves learning.
    caption: >-
      Study sequence for 24 authored programming cases. Four predictions per
      case were saved before the later coding task was requested; 23 cases had
      a scored later outcome. The pinned language model was evaluated as a
      model, not treated as a learner, and no person took part.

  - figure_id: FIG-03
    title: Original and corrected benchmark result
    question: How did the test-harness correction change the primary comparison?
    source: >-
      artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/closure-v1/harness_correction_closure_report.json
    output_manifest: >-
      artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/publication-v4-5a121e6/harness_correction_figure_manifest.json
    output_manifest_hash: 5d50be020ea5ec2ce4724d1e65cde7a9443d3ad1bee0b64dcdd8fed8dce8553c
    generation_revision: 5a121e6
    command: pixi run harness-correction-figure
    outputs: harness_correction_result.pdf, harness_correction_result.svg, harness_correction_summary.csv
    destination: report-results-and-presentation-main-result
    status: primary
    availability: complete
    intended_claim: >-
      Correcting the harness reduced the apparent benefit of executable
      evidence from a large effect to a small, uncertain difference.
    claim_boundary: >-
      Reports one pinned evaluation-model run over the authored cases; the
      corrected result is post-hoc and does not support human-learning claims.
    caption: >-
      Effect of correcting the test harness on 23 eligible authored cases. The
      original replay suggested a 30.4 percentage-point reduction in error; the
      corrected difference was 4.3 points, from 18/23 to 19/23 correct
      predictions, with an interval that included no difference. This post-hoc
      correction describes one pinned model run and does not measure learning.

  - figure_id: FIG-04
    title: Corrected result for every authored case
    question: How are the corrected decisions distributed across cases and controls?
    source: >-
      artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/closure-v1/harness_correction_closure_report.json
    output_manifest: >-
      artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/publication-cases-v4-5a121e6/harness_correction_case_figure_manifest.json
    output_manifest_hash: 7ac17ad07dd90dbcf2edaf9e214efadf9b42410ef313c6a745dd0a48d9d1848b
    generation_revision: 5a121e6
    command: pixi run harness-correction-case-figure
    outputs: harness_correction_cases.pdf, harness_correction_cases.svg, harness_correction_cases.csv
    destination: report-results-supporting-and-presentation-backup
    status: supporting
    availability: complete
    intended_claim: >-
      The aggregate correction is traceable to individual authored cases,
      including controls and one missing criterion outcome.
    claim_boundary: >-
      Shows case-level benchmark decisions and missingness; repeated cases are
      not independent learners.
    caption: >-
      Corrected decisions for all 24 authored cases. Of the 23 cases with a
      scored later outcome, one changed from wrong to right after the relevant
      probe and none became worse; relevant and unrelated evidence produced the
      same decisions throughout. Case h-c2m2-03 had no scored outcome.

  - figure_id: FIG-05
    title: Corrected quality beside measured workload
    question: What additional model and sandbox work accompanied executable evidence?
    source: >-
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/resource-reconciliation-v1/resource_reconciliation_report.json
    output_manifest: >-
      artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/publication-resources-v4-5a121e6/corrected_resource_figure_manifest.json
    output_manifest_hash: b4314f8a029eb6c8646a6bac81468b065f7dc68444b62351b2572d04a1258898
    generation_revision: 5a121e6
    command: pixi run corrected-resource-figure
    outputs: corrected_quality_and_resource_burden.pdf, corrected_quality_and_resource_burden.svg, corrected_resource_figure_data.csv
    destination: report-results-and-presentation-resource-trade-off
    status: primary
    availability: complete
    intended_claim: >-
      Executable evidence added model requests and sandbox executions without a
      reliable improvement in the corrected v1 result.
    claim_boundary: >-
      Describes measured workload for this run, not deployment cost, latency
      guarantees, or tutoring benefit.
    caption: >-
      Prediction quality and recorded workload for one external-model run. The
      relevant-probe condition changed one of 23 eligible decisions while the
      full study used 72 model responses, 32,583 tokens, and 47 completed
      sandbox attempts out of 48. Provider cost was unavailable; these values
      describe experimental workload, not deployment cost or tutoring benefit.

  - figure_id: FIG-06
    title: Bounded evidence updating under stress
    question: Does the bounded tracker remain stable when observations are noisy or misleading?
    source: artifacts/tracker-study/canonical-v1
    output_manifest: >-
      artifacts/tracker-study/canonical-publication-v4-5a121e6/canonical_publication_manifest.json
    output_manifest_hash: 39ab7c640e39ecaaed3981db2f2ac0dd8140654b27605adbb40ad8f18c48eefc
    generation_revision: 5a121e6
    command: pixi run tracker-study-publish-canonical
    outputs: tracker_study_canonical.pdf, tracker_study_canonical.svg, canonical_condition_metrics.csv
    destination: report-tracker-study-and-presentation-technical-result
    status: primary
    availability: complete
    intended_claim: >-
      Limiting the influence of one observation reduced damage from misleading
      evidence in the declared simulator conditions.
    claim_boundary: >-
      Reports a glass-box simulator study of tracker robustness; it is not a
      human-learning or tutoring-efficacy result.
    caption: >-
      Ordinary and bounded Bayesian updates across 500 matched simulated
      episodes per condition. Bounded updating reduced probability error across
      the five noisy or misleading conditions, but was slightly worse in the
      clean condition. This is a tracker stress test under simulation, not a
      study of people or tutoring effectiveness.

  - figure_id: FIG-07
    title: Failure taxonomy and review outcomes
    question: What kinds of failures remained after the benchmark review?
    source: configs/benchmark/v1-failure-taxonomy.yaml
    output_manifest: >-
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/failure-review-reliability-v1/publication-v1-357bdf9/failure_figure_manifest.json
    output_manifest_hash: 53952fa691482c9fb7d93f8fb03b3927f13885c96913d068c4cf43d6f987f64e
    generation_revision: 357bdf9
    command: pixi run python scripts/benchmark_cli.py failure-figure
    outputs: failure_analysis.pdf, failure_analysis.svg, failure_review_rows.csv
    destination: report-limitations-and-presentation-backup
    status: supporting
    availability: complete
    intended_claim: >-
      Independent review found observable failures in evidence quality,
      execution, and interpretation that aggregate scores alone would hide.
    claim_boundary: >-
      Summarises observable failure records; hidden model reasoning is neither
      inferred nor treated as a measured cause.
    caption: >-
      Independent review of six deliberately selected benchmark records. Both
      reviewers assigned the same category to all six: four exposed an authored
      task or test defect, while two showed no observed failure. Agreement on
      this small selected set does not prove that the categories are objectively
      correct or representative of all cases.

  - figure_id: FIG-M7B-01
    title: Prediction error as executable probes are added
    question: Does the proposed selector improve prediction at a fixed budget, and what changes across budgets?
    source: >-
      artifacts/acquisition-study/canonical-v1/primary-analysis-v1/canonical_primary_analysis_report.json and
      artifacts/acquisition-study/canonical-v1/secondary-budget-v1/analysis-v1/canonical_budget_curve_analysis_report.json
    output_manifest: >-
      artifacts/acquisition-study/canonical-v1/publication-v1/acquisition_result_figure_manifest.json
    output_manifest_hash: 39075ff1c7d45838176bc2c2fd620cf67db4d806b570a9b6aef86740405e683b
    generation_revision: f7d70c48f1af63738f98d0cbfb724c18eed449cb
    command: pixi run python scripts/acquisition_study_result_figure.py
    outputs: acquisition_result_report.pdf, acquisition_result_report.svg, acquisition_result_presentation.pdf, acquisition_result_presentation.svg
    destination: report-results-and-presentation-acquisition-main-result
    status: primary
    availability: complete
    intended_claim: >-
      At the fixed budget, the proposed selector beat random choice but not two
      simpler targeted selectors; using more probes increased error across the
      held-out mismatch settings.
    claim_boundary: >-
      Reports paired outcomes from hand-specified simulated environments; it
      does not establish behaviour with people or realised deployment savings.
    caption: >-
      Prediction error across 2,000 simulated episodes per setting. At the
      planned 50% probe budget, the proposed selector reduced error by 1.19
      percentage points relative to random choice, but increased it by 0.85
      points relative to uncertainty selection and by 0.54 points relative to
      standard value of information. These hand-specified simulations do not
      measure human learning or realised deployment savings.

  - figure_id: FIG-M7B-02
    title: Acquisition policy effects across evidence failures
    question: Does the proposed selector remain useful when evidence fails in different ways?
    source: >-
      artifacts/acquisition-study/canonical-v1/primary-analysis-v1/canonical_primary_analysis_report.json
    output_manifest: >-
      artifacts/acquisition-study/canonical-v1/publication-environments-v1/acquisition_environment_figure_manifest.json
    output_manifest_hash: 7228c1a2e5c1f5444ab9827886a8960e3a85643c7fb0bfa0286a726d655cb4bb
    generation_revision: 2595b7e7c4e6f3ee4cf5aea0c8b893964eb9f6e3
    command: pixi run python scripts/acquisition_study_environment_figure.py
    outputs: acquisition_environment_effects_report.pdf, acquisition_environment_effects_report.svg, acquisition_environment_effects_presentation.pdf, acquisition_environment_effects_presentation.svg
    destination: report-results-and-presentation-acquisition-stress-test
    status: primary
    availability: complete
    intended_claim: >-
      The proposed selector helped when its assumptions matched the simulator,
      but its advantage did not survive important evidence failures.
    claim_boundary: >-
      Environment settings are designed stress tests, not estimates of how
      often these failures occur in real tutoring.
    caption: >-
      Paired policy differences at the fixed 50% probe budget. The proposed
      selector helped when evidence behaved as assumed, yet its advantage did
      not survive several held-out evidence failures and it was worse than the
      simpler targeted selectors on average. The failure settings are designed
      stress tests, not estimates of real tutoring conditions.

  - figure_id: FIG-M7B-03
    title: Development ablation of reliability and bounded updating
    question: Which parts of the proposed method explain its development result?
    source: >-
      artifacts/acquisition-study/development-aede5af/ablations-bfdf385/analysis-bfdf385/development_ablation_analysis_report.json
    output_manifest: >-
      artifacts/acquisition-study/development-aede5af/publication-ablation-v1/acquisition_ablation_figure_manifest.json
    output_manifest_hash: 19f849a5e29156ea04bdc43a11a5ed9f7489277cd5b81110cf251af209586df4
    generation_revision: 928442f9bdda34c12baad1772ee398f9969582de
    command: pixi run python scripts/acquisition_study_ablation_figure.py
    outputs: acquisition_ablation_report.pdf, acquisition_ablation_report.svg, acquisition_ablation_presentation.pdf, acquisition_ablation_presentation.svg
    destination: report-appendix-and-presentation-backup
    status: supporting
    availability: complete
    intended_claim: >-
      Development diagnostics found no meaningful interaction advantage from
      combining conservative reliability with bounded updating.
    claim_boundary: >-
      This is a development-only diagnostic; it cannot replace or strengthen
      the frozen canonical result.
    caption: >-
      Development ablation over 300 paired simulated episodes and six held-out
      settings. Conservative reliability estimation and bounded updating did
      not improve prediction when combined; their estimated interaction was
      0.02 percentage points. This diagnostic was examined during development
      and cannot strengthen the frozen canonical result.

  - figure_id: FIG-M7C-01
    title: Prediction errors found within a fixed review budget
    question: Does uncertainty find more prediction errors than random selection at the same review budget?
    source: >-
      artifacts/csedm-study/reproduction-7c5499f/analysis/uncertainty_analysis_report.json
    output_manifest: >-
      artifacts/csedm-study/reproduction-7c5499f/publication/publication_manifest.json
    output_manifest_hash: 9b8ed5d5212ce9175c59d2341451ce86b1418940a1a4d48b3174ab9774ca8d4b
    generation_revision: 7c5499f1b5a04d53ccc5ecbe179de2bf4f521786
    command: pixi run python scripts/csedm_study_reproduce.py
    outputs: uncertainty_error_review.pdf, uncertainty_error_review.svg, uncertainty_error_review_source.csv
    destination: report-results-real-data-companion-and-presentation-backup
    status: primary
    availability: complete
    intended_claim: >-
      On the historical CSEDM records, reviewing the most uncertain half of
      predictions found more errors than random selection was expected to find.
    claim_boundary: >-
      This is error review on historical records from 86 learners; it does not
      test executable probes, tutoring effects, or learning.
    caption: >-
      Error review on 729 historical predictions from 86 learners across 19
      Python problems. Reviewing the 361 most uncertain predictions found
      141/195 errors, or 72.3%, compared with a 49.5% expectation under random
      selection; the 22.8 percentage-point difference had a learner-bootstrap
      95% interval from 16.4 to 29.0 points. This study does not test executable
      probes, tutoring effects, or learning.

  - figure_id: FIG-08
    title: Why an extra coding task appeared to improve one prediction
    question: Why can this case not show that the related coding task helped?
    source: >-
      configs/publication/v1-worked-example.yaml,
      data/benchmarks/v1/controls/unrelated.yaml,
      data/benchmarks/v1/evidence/h-c3m1-02-prompt.md,
      data/benchmarks/v1/evaluator/criterion/h-c2m1-02-prompt.md,
      data/benchmarks/v1/evaluator/criterion/h-c2m1-02-tests.yaml,
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/recorded_responses.jsonl,
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/datasets,
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/criterion/recorded_responses.jsonl,
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/failure-review-v1/review-submissions,
      artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/failure-review-reliability-v1,
      artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/analysis-v1/harness_correction_analysis_report.json,
      and artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/attempts.
    output_manifest: >-
      artifacts/publication/benchmark-worked-example-v1-ba229b9/benchmark_worked_example_figure_manifest.json
    output_manifest_hash: 7faf14c9dff4a6c201df3d322fab9e7b299dca7268d077a134aec399bfb4e34e
    generation_revision: ba229b9c2d7c8b75939c30a1b1dd18210741162e
    command: pixi run python scripts/benchmark_worked_example_figure.py
    outputs: benchmark_worked_example_report.pdf, benchmark_worked_example_report.svg, benchmark_worked_example_presentation.pdf, benchmark_worked_example_presentation.svg, benchmark_worked_example.json, benchmark_worked_example.csv
    destination: report-results-limitations-and-demo-experiment-walkthrough
    status: primary
    availability: complete
    intended_claim: >-
      One case shows how a weak comparison task, a fixed scoring rule, and
      incomplete final tests can make a prediction improvement look convincing.
    claim_boundary: >-
      The example examines a measurement weakness in one model run. It does not
      show that the related task caused a better prediction, or that any person
      learned from tutoring.
    caption: >-
      Worked example from one case in the 24-case benchmark. A conflicting
      first answer scored as a failure; both the related and comparison coding
      tasks passed and changed the fixed score from 0.40 to 0.60. The later
      tests then accepted an incomplete solution, so this case cannot show that
      the related task caused the apparent improvement.

tables:
  - table_id: TAB-M7B-01
    title: Fixed-budget primary acquisition comparisons
    question: How did the proposed selector compare with each declared baseline at the fixed budget?
    source: >-
      artifacts/acquisition-study/canonical-v1/primary-analysis-v1/canonical_primary_analysis_report.json
    output_manifest: >-
      artifacts/acquisition-study/canonical-v1/publication-table-v1/acquisition_primary_result_table_manifest.json
    output_manifest_hash: abb728eed55572f330ad7f939c29554391e90e825e1811e3920cb1a14d0092fa
    generation_revision: 4cb5dfef64abf32f8a5b3d5384487c8097acdd82
    command: pixi run python scripts/acquisition_study_result_table.py
    outputs: acquisition_primary_result_table.csv, acquisition_primary_result_table.tex, acquisition_primary_result_table.md
    destination: report-results-primary-comparison
    status: primary
    availability: complete
    intended_claim: >-
      The proposed selector improved on random choice, but performed worse than
      uncertainty-only selection and plug-in value-of-information selection.
    claim_boundary: >-
      Estimates apply to the frozen simulated environments and fixed 50% probe
      budget; they do not measure human learning or deployed cost.

  - table_id: TAB-M7C-01
    title: CSEDM out-of-fold model comparison
    question: How did the fixed learner-history model compare with the two simple predictors?
    source: >-
      artifacts/csedm-study/reproduction-7c5499f/analysis/uncertainty_analysis_report.json
    output_manifest: >-
      artifacts/csedm-study/reproduction-7c5499f/publication/publication_manifest.json
    output_manifest_hash: 9b8ed5d5212ce9175c59d2341451ce86b1418940a1a4d48b3174ab9774ca8d4b
    generation_revision: 7c5499f1b5a04d53ccc5ecbe179de2bf4f521786
    command: pixi run python scripts/csedm_study_reproduce.py
    outputs: model_comparison.csv, model_comparison.tex
    destination: report-results-real-data-companion
    status: primary
    availability: complete
    intended_claim: >-
      The fixed logistic model was slightly more accurate than the
      training-problem-frequency predictor on the same out-of-fold targets.
    claim_boundary: >-
      The table describes prediction quality on 729 targets from 86 learners;
      it is not evidence of a tutoring or learning effect.

profiles:
  report:
    intended_use: A4 dissertation PDF
    width_in: 6.5
    height_in: 4.5
    font_size_pt: 8.5
    rule: Prefer complete captions, visible denominators, and readable labels.
  presentation:
    intended_use: 16:9 presentation slide
    width_in: 12.8
    height_in: 7.2
    font_size_pt: 14
    rule: Use fewer panels or split the figure when labels cannot be read at distance.
