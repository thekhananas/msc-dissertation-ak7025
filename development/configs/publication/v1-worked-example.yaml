public_summary: >-
  The answer began with "True 3" and ended with "False 2". Two blinded raters
  marked it as conflicting.
same_concept_summary: >-
  A permissions-alias check returned ["read", "write"] and passed its one
  authored test.
different_concept_summary: >-
  A function-and-set control returned ["checked", "new"] and passed its one
  authored test. Its declared concept differed, although it still used set
  mutation.
tracker_rule_summary: >-
  The fixed rule started at 0.50, subtracted 0.10 for the conflicting answer,
  and added 0.20 for any passed check. The decision threshold was 0.60.
criterion_summary: >-
  The later answer returned the expected sorted values and passed 2 of 2
  authored tests.
criterion_test_warning: >-
  The prompt required the supplied list to change. The answer created a new
  list; the tests checked returned values only.
interpretation: >-
  Both passed checks produced the same 0.60 score. The later pass missed the
  requested mutation. This case does not establish a benefit from relevant
  evidence.
claim_boundary: >-
  This post-hoc example comes from one authored case and one evaluation-model
  run. The tracker scores are hand-set rule values, not calibrated
  probabilities. It says nothing about human learning or tutoring quality.
