selection_reason: >-
  This case was chosen after the main analysis. A related coding task changed a
  predicted failure into a predicted pass. A comparison task produced exactly
  the same change, and later review found that the final task's tests missed a
  written requirement. The case therefore shows how an evaluation can
  overstate a success.
public_response_markers:
  - "True 3"
  - "False 2"
same_concept_response_marker: 'return ["read", "write"]'
different_concept_response_marker: 'return ["checked", "new"]'
criterion_response_marker: "filtered = [t for t in tags if t != tag]"
different_concept_prompt_ref: evidence/h-c3m1-02-prompt.md
different_concept_prompt_marker: 'labels.add("checked")'
criterion_prompt_ref: evaluator/criterion/h-c2m1-02-prompt.md
criterion_tests_ref: evaluator/criterion/h-c2m1-02-tests.yaml
criterion_prompt_marker: "The input collection is mutable."
public_summary: >-
  The model first wrote "True 3", then ended with "False 2". Two reviewers saw
  only this answer; both called it conflicting.
same_concept_summary: >-
  The model returned ["read", "write"]. This was correct because permissions
  and granted refer to the same set. Its function passed one automatic test.
different_concept_summary: >-
  The model returned ["checked", "new"]. Its function also passed one automatic
  test. The task was meant to cover a different skill, but it still involved
  changing a shared set.
tracker_rule_summary: >-
  The rule began at 0.50, removed 0.10 because the first answer conflicted with
  itself, and added 0.20 when a coding task passed. Scores of 0.60 or more were
  labelled "pass".
criterion_summary: >-
  The final task asked the model to remove a tag from the supplied list, then
  return the remaining tags in sorted order. Its answer passed both automatic
  tests.
criterion_test_warning: >-
  The model created a new list, so the supplied list did not change. The tests
  checked only the returned values; they never checked the supplied list.
interpretation: >-
  The related task changed "fail" to "pass". The comparison task did the same,
  and the final tests accepted an incomplete solution. This case cannot tell us
  whether the related task helped.
claim_boundary: >-
  This example examines one response from one model run after the main
  analysis. Its scores came from a fixed rule; 0.60 does not mean a 60% chance.
  The case does not measure student learning or tutoring quality.
