schema_version: 1
task_id: mutable-list-aliasing
version: "1.0.0"
title: Shared list references
concept: mutable-list-aliasing
instructions: >-
  Predict exactly what the program prints, then explain why changing `alias`
  affects (or does not affect) `numbers`.
starter_code: |-
  numbers = [1, 2]
  alias = numbers
  alias.append(3)
  print(numbers)
initial_prompt: >-
  Before running the program, what do you think it prints? Explain what
  relationship `alias` has to `numbers`.
evidence_rules:
  correct_output_markers:
    - "[1, 2, 3]"
    - "[1,2,3]"
  correct_explanation_markers:
    - "same list"
    - "same object"
    - "reference"
    - "alias"
  misconception_output_markers:
    - "[1, 2]"
    - "[1,2]"
  misconception_explanation_markers:
    - "copy"
    - "independent"
    - "separate list"
tutor_prompts:
  transfer:
    - >-
      Good reasoning. If two names refer to one mutable object, what would
      happen if the change were made through the other name? Explain before
      trying it.
    - >-
      Now compare `alias = numbers` with `alias = numbers.copy()`. What
      difference would you expect after appending through `alias`, and why?
    - >-
      Suppose a function receives `numbers` and mutates it. What would the
      caller observe? Connect your answer to the relationship between a name
      and an object.
    - >-
      State a general rule for assignment and mutation of Python lists, then
      give one case where making a copy would be necessary.
  hint:
    - >-
      Look closely at the assignment line. Does it construct a new list, or
      give another name to an existing object? Use that distinction to revise
      your prediction.
    - >-
      Imagine checking `id(alias) == id(numbers)` immediately after the
      assignment. What would you expect, and what would that imply for the
      append?
    - >-
      Contrast the original assignment with `alias = numbers.copy()`. Which
      version creates two list objects? Use that comparison to trace the
      program again.
    - >-
      Draw one object and the variable names that point to it after each line.
      At which line, if any, is a second list created?
  clarify:
    - >-
      Your response points in two directions. State whether a new list is
      created, then use that choice to make one consistent prediction.
    - >-
      Separate your answer into two claims: how many list objects exist, and
      what gets mutated. Which pair of claims is consistent?
    - >-
      Choose one model: shared object or independent copy. Trace all four lines
      using only that model, then report the resulting output.
  incomplete:
    - >-
      You have identified part of the result. Now explain whether `alias` refers
      to the same list as `numbers`, and why that affects the output.
  probe:
    - >-
      Focus on `alias = numbers`. After that line, how many list objects do you
      think exist, and what makes you think so?
    - >-
      Which line in the program could create a new list? Identify it, or
      explain why none of the lines does so.
    - >-
      Before predicting the output, describe what `append` changes: a variable
      name or the list object reached through that name?
  encourage:
    - >-
      Start with just the assignment line: does `alias = numbers` create a new
      list? A short answer is enough.
    - Try naming only the list objects that exist after the first two lines.
    - >-
      Take one step: what does `append(3)` do to the list reached through
      `alias`?
