[workspace]
name = "socratic-tutor-development"
version = "0.1.0"
description = "Master's POC workspace for Socratic tutoring and RL evaluation"
authors = ["Anas Khan"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
nodejs = "22.*"
pnpm = ">=10,<11"

[pypi-dependencies]
socratic-tutor = { path = ".", editable = true }
hatchling = ">=1.27,<2"
pytest = ">=8.4,<9"
pytest-cov = ">=6.2,<7"
hypothesis = ">=6.135,<7"
ruff = ">=0.12,<1"
pyright = ">=1.1.403,<2"
modal = ">=1.5, <2"
matplotlib = ">=3.10,<4"

[tasks.install-web]
cmd = "pnpm install --frozen-lockfile"

[tasks.dev-api]
cmd = "uvicorn apps.api.main:app --reload --host 127.0.0.1 --port 8000"
depends-on = ["prepare-demo-log"]

[tasks.dev-web]
cmd = "pnpm --dir apps/web dev --host 127.0.0.1"

[tasks.dev]
cmd = "pnpm dev"
depends-on = ["prepare-demo-log"]

[tasks.prepare-demo-log]
cmd = "python scripts/prepare_demo_log.py"

[tasks.test]
cmd = "pytest"

[tasks.test-web]
cmd = "pnpm --dir apps/web test --run"

[tasks.test-e2e]
cmd = "pnpm --dir apps/web test:e2e"

[tasks.lint]
cmd = "ruff check ."

[tasks.format-check]
cmd = "ruff format --check ."

[tasks.typecheck-python]
cmd = "pyright src apps tests experiments analysis scripts"

[tasks.typecheck-web]
cmd = "pnpm --dir apps/web typecheck"

[tasks.typecheck]
depends-on = ["typecheck-python", "typecheck-web"]

[tasks.config-smoke]
cmd = "python experiments/compose_config.py --cfg job --resolve"

[tasks.benchmark-validate]
cmd = "python scripts/benchmark_cli.py validate --manifest data/benchmarks/dev-v0/manifest.yaml"

[tasks.benchmark-v1-validate]
cmd = "python scripts/benchmark_cli.py validate --manifest data/benchmarks/v1/manifest.yaml"

[tasks.benchmark-v1-shortcuts]
cmd = "python scripts/benchmark_cli.py shortcuts --input configs/benchmark/v1-shortcuts.yaml --output artifacts/benchmark-checks/v1-shortcuts.json"

[tasks.benchmark-v1-case-shortcuts]
cmd = "python scripts/benchmark_cli.py case-shortcuts --manifest data/benchmarks/v1/manifest.yaml --input configs/benchmark/v1-case-linked-shortcuts.yaml --output artifacts/benchmark-checks/v1-case-shortcuts-frozen.json"

[tasks.benchmark-v1-readiness]
cmd = "python scripts/benchmark_cli.py readiness --manifest data/benchmarks/v1/manifest.yaml --case-shortcut-summary artifacts/benchmark-checks/v1-case-shortcuts-frozen.json --output artifacts/benchmark-checks/v1-readiness-frozen.json"
depends-on = ["benchmark-v1-case-shortcuts"]

[tasks.benchmark-v1-failure-taxonomy]
cmd = "python scripts/benchmark_cli.py failure-taxonomy-validate --input configs/benchmark/v1-failure-taxonomy.yaml"

[tasks.benchmark-v1-analysis-spec]
cmd = "python scripts/benchmark_cli.py analysis-spec-validate --input configs/benchmark/v1-analysis-spec.yaml"

[tasks.benchmark-v1-calibration-decision]
cmd = "python scripts/benchmark_cli.py calibration-decision --input configs/benchmark/v1-uncalibrated-decision.yaml --heldout-manifest data/benchmarks/v1/manifest.yaml --benchmark-root data/benchmarks --analysis-specification configs/benchmark/v1-analysis-spec.yaml --output artifacts/benchmark-checks/v1-calibration-decision.json"

[tasks.benchmark-v1-reference-integrity]
cmd = "python scripts/benchmark_cli.py reference-integrity --plan configs/benchmark/v1-reference-integrity.yaml --manifest data/benchmarks/v1/manifest.yaml --output-root artifacts/benchmark-integrity/v1-reference-integrity-20260823-001"

[tasks.benchmark-smoke]
cmd = "python scripts/benchmark_cli.py smoke --manifest data/benchmarks/dev-v0/manifest.yaml --decision-plan configs/benchmark/dev-v0-replay-decision.yaml --criterion-plan configs/benchmark/dev-v0-replay-criterion.yaml --output-root artifacts/benchmark-smoke/dev-v0-replay-20260822-003"

[tasks.benchmark-shortcuts]
cmd = "python scripts/benchmark_cli.py shortcuts --input configs/benchmark/dev-v0-shortcuts.yaml --output artifacts/benchmark-checks/dev-v0-shortcuts.json"

[tasks.benchmark-sensitivity]
cmd = "python scripts/benchmark_cli.py sensitivity --input configs/benchmark/dev-v0-sensitivity.yaml --output artifacts/benchmark-checks/dev-v0-sensitivity.json"

[tasks.benchmark-v1-sensitivity]
cmd = "python scripts/benchmark_cli.py sensitivity --input configs/benchmark/v1-sensitivity.yaml --output artifacts/benchmark-checks/v1-sensitivity.json"

[tasks.benchmark-v2-binary-sensitivity]
cmd = "python scripts/benchmark_cli.py binary-sensitivity --input configs/benchmark/v2-binary-sensitivity.yaml --output artifacts/benchmark-checks/v2-binary-sensitivity-20260901-002.json"

[tasks.benchmark-design-validate]
cmd = "python scripts/validate_benchmark_design.py data/benchmark-design/v1/case-allocation.yaml"

[tasks.benchmark-generate]
cmd = "python scripts/benchmark_generate.py"

[tasks.benchmark-evaluate]
cmd = "python scripts/benchmark_cli.py evaluate"

[tasks.harness-correction-replay]
cmd = "python scripts/benchmark_cli.py harness-correction-replay --manifest data/benchmarks/v1/manifest.yaml --decision-responses artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/recorded_responses.jsonl --criterion-responses artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/criterion/recorded_responses.jsonl --original-evidence-root artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/decision/evidence_executions --original-criterion-root artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/criterion/records --pixi-lock pixi.lock --output-root artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001 --run-id cerebras-gpt-oss-120b-v1-harness-correction-20260903-001 --code-revision $(git rev-parse HEAD) --created-at-utc 2026-09-03T13:55:41Z"

[tasks.harness-correction-analyse]
cmd = "python scripts/benchmark_cli.py harness-correction-analyse --correction-report artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/harness_correction_replay_report.json --public-manifest artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/public_manifest.json --public-rating-report artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/public-rating-submissions/public-answer-rating-report.json --methodology-clarification artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/methodology_clarification.json --inferential-hierarchy artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/inferential_hierarchy.json --analysis-specification configs/benchmark/v1-analysis-spec.yaml --original-primary-report artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/primary-v1/primary_analysis_report.json --original-secondary-report artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/secondary-v1/secondary_analysis_report.json --benchmark-root data/benchmarks/v1 --pixi-lock pixi.lock --output-root artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/analysis-v1 --code-revision $(git rev-parse HEAD)"

[tasks.harness-correction-close]
cmd = "python scripts/benchmark_cli.py harness-correction-close --original-closure artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/closure-v1/primary_analysis_manifest.json --correction-replay-report artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/harness_correction_replay_report.json --correction-analysis-plan artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/analysis-v1/harness_correction_analysis_plan.json --correction-analysis-report artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/analysis-v1/harness_correction_analysis_report.json --partial-correction-report artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/probe-correction-v1/probe_correction_sensitivity_report.json --original-interpretation-report artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/result-interpretation-v1/result_interpretation_report.json --original-resource-report artifacts/external-decision/cerebras-gpt-oss-120b-20260824-001/decision-seal/analysis/resource-reconciliation-v1/resource_reconciliation_report.json --pixi-lock pixi.lock --output-root artifacts/harness-correction/cerebras-gpt-oss-120b-20260903-001/closure-v1 --code-revision $(git rev-parse HEAD)"

[tasks.docs-check]
cmd = "python scripts/check_docs.py"

[tasks.build-web]
cmd = "pnpm --dir apps/web build"

[tasks.check]
cmd = "python -c \"print('All workspace checks passed')\""
depends-on = ["lint", "format-check", "typecheck", "test", "test-web", "test-e2e", "config-smoke", "benchmark-validate", "benchmark-v1-validate", "benchmark-v1-readiness", "benchmark-v1-failure-taxonomy", "benchmark-v1-analysis-spec", "benchmark-v1-calibration-decision", "benchmark-v1-sensitivity", "benchmark-v2-binary-sensitivity", "benchmark-design-validate", "docs-check", "build-web"]
